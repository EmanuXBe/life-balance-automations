name: Fetch Journaling Data — Dashboard

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:

# Never let this workflow race itself — a newer run replaces an older in-flight one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  fetch-journaling:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch journaling data from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_JOURNALING_DB_ID: ${{ secrets.NOTION_JOURNALING_DB_ID }}
        run: node fetch-journaling-data.js

      - name: Commit journaling-data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add journaling-data.json
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "chore: update journaling data [skip ci]"
          for attempt in 1 2 3 4 5; do
            git push && { echo "Pushed on attempt $attempt."; exit 0; }
            echo "Push $attempt rejected — rebasing onto latest main and retrying…"
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push journaling-data.json after 5 attempts."; exit 1