name: Fetch Journaling Data — Dashboard

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:

# Never let this workflow race itself — a newer run replaces an older in-flight one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  fetch-journaling:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch journaling data from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_JOURNALING_DB_ID: ${{ secrets.NOTION_JOURNALING_DB_ID }}
        run: node fetch-journaling-data.js

      - name: Encrypt journaling-data.json → journaling-data.enc.json
        env:
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
        run: node encrypt-data.js journaling-data.json

      - name: Commit journaling-data.enc.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add journaling-data.enc.json
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "chore: update journaling data [skip ci]"
          for attempt in 1 2 3 4 5; do
            git push && { echo "Pushed on attempt $attempt."; exit 0; }
            echo "Push $attempt rejected — replaying our change onto latest main…"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git checkout origin/main -- . ':(exclude)journaling-data.enc.json' 2>/dev/null || true
            git reset --soft origin/main
            git add -A
            git diff --cached --quiet && { echo "Nothing left to push."; exit 0; }
            git commit -m "chore: update journaling data [skip ci]"
            sleep $((attempt * 4))
          done
          echo "::error::Could not push journaling-data.enc.json after 5 attempts."; exit 1