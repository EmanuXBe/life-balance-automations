name: Generate AI Coaching — Dashboard

on:
  schedule:
    - cron: '30 9 * * *'   # 4:30 AM Bogotá — AM coach
    - cron: '30 2 * * *'   # 9:30 PM Bogotá — PM coach
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  coaching:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate coaching advice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate-coaching.js

      - name: Commit coaching.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coaching.json
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "chore: update coaching advice [skip ci]"
          for attempt in 1 2 3 4 5; do
            git push && { echo "Pushed on attempt $attempt."; exit 0; }
            echo "Push $attempt rejected — rebasing onto latest main and retrying…"
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push coaching.json after 5 attempts."; exit 1