name: Fetch Notion Data — Dashboard

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:       # manual trigger for testing

# Never let this workflow race itself — a newer run replaces an older in-flight one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to commit data.json back to the repo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch data from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}   # Daily 10 DB — different from NOTION_PAGE_ID
        run: node fetch-notion-data.js

      - name: Encrypt data.json → data.enc.json
        env:
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
        run: node encrypt-data.js data.json

      - name: Commit data.enc.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.enc.json
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "chore: update dashboard data [skip ci]"
          for attempt in 1 2 3 4 5; do
            git push && { echo "Pushed on attempt $attempt."; exit 0; }
            echo "Push $attempt rejected — rebasing onto latest main and retrying…"
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push data.json after 5 attempts."; exit 1